services:
  - type: web
    name: job-auto-apply
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: YOUR_NAME
        sync: false
      - key: YOUR_PHONE
        sync: false
      - key: YOUR_EMAIL
        sync: false
      - key: DEBUG
        value: "false"